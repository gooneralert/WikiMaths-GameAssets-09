<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Fancy Pants Adventures: World 1</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #game { width: 100vw; height: 100vh; }
  #game > * { width: 100% !important; height: 100% !important; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #96a0b5; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  .loading .dot { width: 30px; height: 30px; border: 3px solid #222838; border-top-color: #9db4ff; border-radius: 50%; animation: spin .9s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="/cdn/assets/local-games/the-fancy-pants-adventures-world-1/__offline__/bootstrap.js"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  publicPath: "/ruffle/",
  autoplay: "on",
  unmuteOverlay: "hidden",
  splashScreen: false,
  letterbox: "on",
  backgroundColor: "#000000",
  scale: "showAll",
  quality: "high",
  wmode: "direct",
  logLevel: "error",
  menu: "on",
  salign: "tl",
  base: null,
  allowScriptAccess: false,
  allowNetworking: "none",
  openUrlMode: "deny"
};
</script>
<script src="/ruffle/ruffle.js"></script>
</head>
<body>
<div id="game"><div class="loading"><div><div class="dot"></div>Loading Flash game…</div></div></div>
<script>
(function () {
  function start() {
    var container = document.getElementById("game");
    container.innerHTML = "";
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.id = "ruffle-player";
      container.appendChild(player);
      player.load({ url: "/game.swf", autoplay: "on", unmuteOverlay: "hidden", splashScreen: false });
    } catch (err) {
      container.innerHTML = '<div class="loading"><div>Could not start the Flash player.<br><code>' +
        String(err && err.message || err).replace(/[<>&]/g, "") + "</code></div></div>";
      console.error(err);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</body>
</html>
